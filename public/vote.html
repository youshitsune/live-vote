<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
        <link href="/css/vote.css" rel="stylesheet">
        <title>Live Vote</title>
    </head>
    <body>
        <main>
            <div class="card" id="lobby" style="display:none">
                <div class="lobby">
                    <h2>Wait...</h2>
                </div>
            </div>
            <div class="card" id="qcard" style="display:none">
                <h2 class="q" id="qtext"></h2>
                <div class="opts" id="opts"></div>
                <div class="meta" id="meta"></div>
                <div id="badge"></div>
            </div>
            <div class="card" id="error" style="display:none">
                <div class="err">
                    <h2>Invalid token</h2>
                </div>
            </div>
        </main>
        <script src="/socket.io/socket.io.js"></script>
        <script src="/js/vote.js"></script>
    </body>
</html>
