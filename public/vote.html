<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live Vote</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;background:#0b0d12;color:#f4f6fa;min-height:100vh;display:flex;flex-direction:column}
  header{padding:14px 18px;background:#141821;border-bottom:1px solid #232838;display:flex;align-items:center;gap:10px}
  header h1{margin:0;font-size:16px;font-weight:600;opacity:.9}
  .dot{width:8px;height:8px;border-radius:50%;background:#2ecc71;box-shadow:0 0 8px #2ecc71}
  main{flex:1;padding:24px 18px;max-width:560px;margin:0 auto;width:100%}
  .card{background:#141821;border:1px solid #232838;border-radius:16px;padding:20px}
  h2.q{font-size:22px;line-height:1.25;margin:0 0 18px}
  .lobby{text-align:center;padding:40px 20px;color:#9aa3b2}
  .lobby h2{color:#f4f6fa;margin:0 0 8px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{position:relative;border:1px solid #2a3042;background:#1a1f2e;color:#f4f6fa;border-radius:12px;padding:16px 16px;font-size:17px;text-align:left;cursor:pointer;transition:.15s;border:0}
  .opt:disabled{opacity:.5;cursor:default}
  .opt:not(:disabled):active{transform:scale(.98)}
  .bar{position:absolute;left:0;top:0;bottom:0;border-radius:12px;z-index:0;transition:width .4s ease;background:rgba(88,140,255,.18)}
  .opt span{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .opt .pct{font-weight:700;color:#7fa6ff}
  .opt.chosen{border:1px solid #588cff;background:#1d2540}
  .meta{margin-top:14px;font-size:13px;color:#9aa3b2;text-align:center}
  .voted-badge{display:inline-block;margin-top:10px;padding:6px 12px;border-radius:999px;background:#1e3a2a;color:#5ee08a;font-size:13px}
  .foot{padding:14px;text-align:center;font-size:12px;color:#5a6272}
  .err{color:#ff6b6b}
</style>
</head>
<body>
<header><div class="dot"></div><h1 id="title">Live Vote</h1></header>
<main>
  <div class="card" id="lobby" style="display:none">
    <div class="lobby">
      <h2>Waiting for next question…</h2>
      <p>Keep this page open. It will update automatically.</p>
    </div>
  </div>
  <div class="card" id="qcard" style="display:none">
    <h2 class="q" id="qtext"></h2>
    <div class="opts" id="opts"></div>
    <div class="meta" id="meta"></div>
    <div id="badge"></div>
  </div>
</main>
<div class="foot">Live voting · anonymous · device id stored in this browser</div>
<script src="/socket.io/socket.io.js"></script>
<script>
(function(){
  const sid = localStorage.getItem('lv_voter') || (crypto.randomUUID?crypto.randomUUID():'v'+Math.random().toString(36).slice(2));
  localStorage.setItem('lv_voter',sid);

  const socket = io();
  let myChoice = null;
  let myVoted = false;
  let currentIdx = null;

  socket.on('connect', () => socket.emit('identify', { voterId: sid }));

  socket.on('state', (s) => {
    document.getElementById('title').textContent = s.title || 'Live Vote';
    if (s.questionIndex < 0 || !s.question) {
      document.getElementById('lobby').style.display='block';
      document.getElementById('qcard').style.display='none';
      currentIdx = s.questionIndex;
      myVoted = false; myChoice = null;
      return;
    }
    if (currentIdx !== s.questionIndex) {
      currentIdx = s.questionIndex;
      myVoted = false; myChoice = null;
    }
    document.getElementById('lobby').style.display='none';
    document.getElementById('qcard').style.display='block';
    document.getElementById('qtext').textContent = s.question;
    renderOptions(s);
    const badge = document.getElementById('badge');
    badge.innerHTML = myVoted ? '<div class="voted-badge">✓ Vote recorded</div>' : '';
    document.getElementById('meta').textContent = '';
  });

  socket.on('you', (y) => {
    myVoted = !!y.voted;
    myChoice = (y.voted ? y.choice : null);
    const badge = document.getElementById('badge');
    badge.innerHTML = myVoted ? '<div class="voted-badge">✓ Vote recorded</div>' : '';
    document.querySelectorAll('.opt').forEach((b,i)=>{
      if (myVoted) b.disabled = true;
      if (i===myChoice) b.classList.add('chosen');
    });
  });

  socket.on('reset', () => { myVoted=false; myChoice=null; });

  function renderOptions(s){
    const wrap = document.getElementById('opts');
    wrap.innerHTML = '';
    s.options.forEach((opt,i)=>{
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.dataset.idx = i;
      btn.disabled = myVoted;
      if (i===myChoice) btn.classList.add('chosen');
      btn.innerHTML = '<span>'+escapeHtml(opt)+'</span>';
      btn.onclick = () => {
        if (myVoted) return;
        socket.emit('vote', { optionIndex: i });
        myVoted = true; myChoice = i;
        document.querySelectorAll('.opt').forEach((b,j)=>{ b.disabled=true; if(j===i) b.classList.add('chosen'); });
        document.getElementById('badge').innerHTML = '<div class="voted-badge">✓ Vote recorded</div>';
      };
      wrap.appendChild(btn);
    });
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
})();
</script>
</body>
</html>
